version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Library releases are rolled out by hand: publish, then API, then web.
      - dependency-name: queryhost
      # @astrojs/preact only supports Preact 10.
      - dependency-name: preact
        update-types: [version-update:semver-major]
      # @types/node tracks the Node.js 24 runtime; bump it with the engines field.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # ext-apps 2 requires the MCP SDK 2 split packages; migrate the MCP stack together.
      - dependency-name: "@modelcontextprotocol/ext-apps"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
