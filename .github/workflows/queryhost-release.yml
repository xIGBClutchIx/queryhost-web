name: QueryHost release

# Opens a pull request that moves the exact `queryhost` pin to a newer npm release, and
# merges it, which deploys, once it is the bot's untouched single commit, current with the
# default branch, `verify` passed on its head, no Codex review of that head has unresolved
# findings, and the live API already serves a compatible `queryhost`, so the site never
# lists a game the API rejects. Close it, mark it draft, or push to its branch to stop it.
#
# The library's publish workflow dispatches this with the released version as soon as npm
# has it; the schedule is the fallback and runs the later merge checks.
#
# The steps live in queryhost-api's `consumer-bump.yml`, which the API also calls, so both
# consumers get fixes at once. Tracking `@main` means a change merged there takes effect
# here on the next run without a review in this repository; both repositories have the
# same owner, which accepts that trade-off.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      version:
        description: queryhost version to pin (defaults to the npm latest tag)
        required: false
        type: string

concurrency:
  group: queryhost-release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    # The called jobs narrow this further: the job that runs package code gets only
    # `contents: read`, and the job that writes never runs package code.
    permissions:
      actions: write
      checks: read
      contents: write
      pull-requests: write
    uses: xIGBClutchIx/queryhost-api/.github/workflows/consumer-bump.yml@main
    with:
      commit_title: Update queryhost to
      version: ${{ inputs.version || '' }}
      # The private API validates game IDs against its own pin, so merging waits for it.
      api_repo: xIGBClutchIx/queryhost-api
      api_environment: queryhost / production
